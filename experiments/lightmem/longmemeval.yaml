# LightMem on LongMemEval-S, default config (r=0.8, th=1024) — THE PAPER'S MAIN
# EXPERIMENT (RQ1/RQ2/RQ3).
#
# Scored against the per-fact has_answer flag rather than an LLM labeler: a
# memory is relevant iff it was constructed or updated from a turn
# LongMemEval-S marks has_answer. That is the relevance mapping the paper
# reports, so the qrels come from evalgrid.pipeline.qrels_has_answer:
#   outputs/_qrels/lightmem/<dataset>/<mem-model>/has_answer/
# candidate_source=sweep keeps the labeler segment as plain "has_answer"
# ("retrieval" would append "-retrieval" and point at a tree never built here).
#
#   python -m evalgrid.pipeline.ingest           --exp experiments/lightmem/longmemeval.yaml --mem-base-url http://localhost:8000/v1
#   python -m evalgrid.pipeline.qrels_has_answer --exp experiments/lightmem/longmemeval.yaml
#   SPEC=experiments/lightmem/longmemeval.yaml bash experiments/run_all_retrieval.sh
#   SPEC=experiments/lightmem/longmemeval.yaml bash experiments/run_all_answers.sh
#   SPEC=experiments/lightmem/longmemeval.yaml bash experiments/run_all_judge.sh
#
# Not measured here: LightMem's own retrieve-then-answer loop. The five stages
# rank the flat corpus with the retrievers below and answer with the shared
# prompt, which is what makes the LightMem / Naive RAG / A-Mem rows comparable.

system: lightmem
dataset: longmemeval_s
mem_model: Qwen/Qwen3-30B-A3B-Instruct-2507
labeler_model: has_answer
candidate_source: sweep   # keep plain "has_answer" segment (no "-retrieval" suffix)

# Answer/judge models — part of the experiment (they key the answer output path).
# Keep judge != gen to avoid self-grading bias. gpt-4o-mini is this project's
# judge, held fixed across every system so the cross-system table is comparable;
# it is also the judge HyperMem's paper reports and LightMem's secondary judge.
# Re-judge the same predictions with JUDGE_MODEL=gpt-5.5 (LightMem's primary)
# for a sensitivity check — metrics files coexist per judge, so both can sit
# side by side.
gen_model: Qwen/Qwen3-30B-A3B-Instruct-2507
judge_model: gpt-4o-mini

# The paper's 11 retrievers (3 sparse, 5 dense, 3 hybrid). Entry format matches
# the retrieve --retriever* flags: bm25 | dense:MODEL[@http://host/v1] |
# sparse:MODEL | fusion:MODEL[@url] (BM25 + dense, 0.5/0.5 min-max score
# fusion) | hybrid:MODEL (dual-representation model).
# The @localhost dense entries each need a vllm embedding server already running
# on the matching port (see "Where they run" in the README); everything else loads in-process.
retrievers:
  # The paper's eight retrievers (RQ2).
  # --- sparse ---
  - bm25
  - sparse:naver/splade-v3
  # --- dense ---
  - dense:sentence-transformers/all-MiniLM-L6-v2
  - dense:Qwen/Qwen3-Embedding-0.6B@http://localhost:8001/v1
  - dense:Qwen/Qwen3-Embedding-4B@http://localhost:8002/v1
  # --- fusion: BM25 + dense, reciprocal rank fusion ---
  - rrf:sentence-transformers/all-MiniLM-L6-v2
  - rrf:Qwen/Qwen3-Embedding-0.6B@http://localhost:8001/v1
  - rrf:Qwen/Qwen3-Embedding-4B@http://localhost:8002/v1


# --- The retriever grid, inside LightMem's own loop -------------------------
# Eight settings, identical on every system spec, so a
# cell of that table means the same thing in every row. Same eight as the
# `retrievers:` list above.
#
# The MiniLM rows are LightMem's own encoder, and it has no post-ranking step,
# so flat-MiniLM vs native-MiniLM is the NO-OP CHECK on the swap machinery.
native_retrievers:
  # --- sparse ---
  - bm25
  - sparse:naver/splade-v3
  # --- dense ---
  - dense:sentence-transformers/all-MiniLM-L6-v2          # LightMem's own encoder
  - dense:Qwen/Qwen3-Embedding-0.6B@http://localhost:8001/v1
  - dense:Qwen/Qwen3-Embedding-4B@http://localhost:8002/v1
  # --- fusion: BM25 + dense, reciprocal rank fusion (rrf_k=60) ---
  - rrf:sentence-transformers/all-MiniLM-L6-v2
  - rrf:Qwen/Qwen3-Embedding-0.6B@http://localhost:8001/v1
  - rrf:Qwen/Qwen3-Embedding-4B@http://localhost:8002/v1

# --- Native path: the imposed retrieval depth -------------------------------
# Read ONLY by the two stages that run LightMem's own loop
# (pipeline/retrieve._run_native and pipeline/answer._run_native, live runs).
# The flat sweep and the shared-prompt answer path ignore it — their depth is
# the `--top-k` axis every system is compared on, default 10.
#
#   python -m evalgrid.pipeline.retrieve --retriever native \
#       --exp experiments/lightmem/longmemeval.yaml
#   python -m evalgrid.pipeline.answer --retriever native --prompt native \
#       --exp experiments/lightmem/longmemeval.yaml \
#       --from-retrieval <the dir above> --top-k 5    # or --context-budget 500
#
# WHY IT IS NOT SPELLED `top_k`. --top-k means two different things. On the
# native path it is RETRIEVAL depth — retriever identity, pushed into the
# system's own retriever before it runs, and keyed into the run directory as a
# `-top270` segment (lib/paths.native_segment), so this condition can never
# overwrite the published-depth control. On the shared path it is PROMPT depth,
# the axis every system is compared on. One spec drives both halves of a sweep,
# so the two cannot share a key: a `top_k: 270` here would silently move the
# shared comparison from top10 to top270.
#
# NOT APPLIED ON A REPLAY (--from-retrieval). There --top-k is a cut over units
# already retrieved — an answer-side axis that gets swept — so it comes from the
# CLI or not at all.
#
# `--published-depth` OPTS OUT, and that is how the published-depth control runs
# off this same spec: it retrieves at the depth in the system's own config and
# its directory carries no `-top<k>`. scripts/query.sh passes it
# whenever NATIVE_TOP_K is empty.
#
# The depth belongs in this spec rather than in evalgrid/configs/lightmem/default.yaml
# because a knob set there changes the ranking while leaving the run in the same
# directory as the setting before it.
#
# 270: 1.0 units/k and 30 tokens/k, measured from outputs/_smoke2_retrieval on
# 2026-08-15 — ~2x headroom on both answer axes (top-50 memories, a 4000-token
# budget), with tokens the binding one for LightMem. Its units are the smallest
# in the grid after Mem0's, which is why its k is nearly the largest.
#
# This is the depth that makes a budget cell measurable at all for LightMem: at
# its published depth of 10 the whole ranking was ~271 tokens on that sample, so
# a --context-budget 500 run could not fill the budget even by taking all of it,
# and the cell came back context_underfilled.
#
# Depth for LightMem's OWN retriever (config key `retrieve_k`, read by
# LightMemPlugin as the memory-manager's `top_k`).
native_top_k: 270
