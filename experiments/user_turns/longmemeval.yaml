# Raw USER turns on LongMemEval-S — the user-only ABLATION of the naive-RAG
# baseline. The main baseline is experiments/all_turns/longmemeval.yaml.
#
# Use this row to answer "what does the assistant side contribute?", never as
# the headline Naive RAG number: no published LongMemEval table is computed over
# a user-only corpus, and LightMem's paper scores Naive RAG 98.21 on the 56
# single-session-assistant questions, which this corpus cannot reach.
#
# Not a memory system: there is no construction stage and no plugin. The corpus
# is the raw user turns, written by evalgrid.pipeline.qrels_turns --roles user,
# so these coordinates MUST match what it wrote:
#   outputs/_qrels/user_turns/<dataset>/none/has_answer/
# mem_model is the literal string "none" for that reason, and
# candidate_source=sweep keeps the labeler segment as plain "has_answer"
# ("retrieval" would append "-retrieval" and point at a tree never built here).
#
#   python -m evalgrid.pipeline.qrels_turns --dataset longmemeval_s --roles user
#   SPEC=experiments/user_turns/longmemeval.yaml bash experiments/run_all_retrieval.sh
#   SPEC=experiments/user_turns/longmemeval.yaml bash experiments/run_all_answers.sh
#   SPEC=experiments/user_turns/longmemeval.yaml bash experiments/run_all_judge.sh
#
# Note there is no ingest line above — that is the whole point of this spec.
# Zero construction cost is the baseline every memory system is charged against.
# The Full-context baseline comes from the same corpus:
#   SPEC=... FULL_ONLY=1 bash experiments/run_all_answers.sh

system: user_turns
dataset: longmemeval_s
mem_model: none
labeler_model: has_answer
candidate_source: sweep

# Answer/judge models. gpt-4o-mini is this project's judge, held fixed across
# every system so the cross-system table is comparable. Override per-run with
# GEN_MODEL=... / JUDGE_MODEL=... (JUDGE_MODEL=gpt-5.5 is LightMem's primary
# judge — metrics files coexist per judge).
gen_model: Qwen/Qwen3-30B-A3B-Instruct-2507
judge_model: gpt-4o-mini

# The same 11 retrievers as the LightMem spec, so RQ3 compares matched
# retrievers over the two representations. See
# experiments/lightmem/longmemeval.yaml for the entry format.
retrievers:
  # The paper's eight retrievers (RQ2).
  # --- sparse ---
  - bm25
  - sparse:naver/splade-v3
  # --- dense ---
  - dense:sentence-transformers/all-MiniLM-L6-v2
  - dense:Qwen/Qwen3-Embedding-0.6B@http://localhost:8001/v1
  - dense:Qwen/Qwen3-Embedding-4B@http://localhost:8002/v1
  # --- fusion: BM25 + dense, reciprocal rank fusion ---
  - rrf:sentence-transformers/all-MiniLM-L6-v2
  - rrf:Qwen/Qwen3-Embedding-0.6B@http://localhost:8001/v1
  - rrf:Qwen/Qwen3-Embedding-4B@http://localhost:8002/v1
